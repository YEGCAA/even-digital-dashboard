name: Atualizar bundle Facilita

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: facilita-bundle
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Coletar bundle da Facilita
        env:
          FACILITA_PROXY_URL: ${{ secrets.FACILITA_PROXY_URL }}
        run: node scripts/collect-facilita-bundle.mjs

      - name: Publicar em gh-pages (so a pasta data/, sem mexer no resto do site)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./data
          destination_dir: data
          keep_files: true
          user_name: 'facilita-bundle-bot'
          user_email: 'actions@github.com'
